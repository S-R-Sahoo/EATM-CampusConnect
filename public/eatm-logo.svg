<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4627"/>
      <stop offset="100%" stop-color="#052716"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Outer Shield Border -->
  <path d="M 50 6 C 75 6, 90 14, 90 28 C 90 62, 50 92, 50 94 C 50 94, 10 62, 10 28 C 10 14, 25 6, 50 6 Z" fill="url(#shieldGrad)" stroke="#d97706" stroke-width="3.5" />
  
  <!-- Inner Shield Inset -->
  <path d="M 50 12 C 70 12, 83 18, 83 30 C 83 58, 50 84, 50 86 C 50 86, 17 58, 17 30 C 17 18, 30 12, 50 12 Z" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- EATM Atom / Orbit Rings -->
  <ellipse cx="50" cy="46" rx="24" ry="9" fill="none" stroke="#f59e0b" stroke-width="1.8" transform="rotate(-30 50 46)" opacity="0.85"/>
  <ellipse cx="50" cy="46" rx="24" ry="9" fill="none" stroke="#f59e0b" stroke-width="1.8" transform="rotate(30 50 46)" opacity="0.85"/>
  
  <!-- Book / Knowledge Base -->
  <path d="M 32 54 Q 41 51, 50 54 Q 59 51, 68 54 L 68 64 Q 59 61, 50 64 Q 41 61, 32 64 Z" fill="#ffffff" stroke="#0b4627" stroke-width="1" />
  <line x1="50" y1="54" x2="50" y2="64" stroke="#0b4627" stroke-width="1.5" />
  
  <!-- Graduation Cap / Torch -->
  <polygon points="50,28 32,37 50,45 68,37" fill="#dc2626" stroke="#f59e0b" stroke-width="1.2"/>
  <polygon points="61,42 61,49 59,51 57,49 57,44" fill="#f59e0b"/>
  
  <!-- Text "EATM" banner -->
  <rect x="25" y="69" width="50" height="15" rx="3" fill="#dc2626" stroke="#ffffff" stroke-width="1.2" />
  <text x="50" y="80.5" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">EATM</text>
</svg>
